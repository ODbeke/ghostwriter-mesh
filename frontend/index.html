<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GhostWriter | Premium AI Mesh</title>
    <meta name="description" content="Decentralized Intelligence. Masterful Prose.">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-gradient"></div>
    
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-logo">
                <span class="logo-text">GhostWriter</span><span class="ghost-icon">👻</span>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="hero">
            <h1 class="hero-title">Decentralized Intelligence.<br>Masterful Prose.</h1>
            <p class="hero-subtitle">GhostWriter leverages a peer-to-peer AI agent swarm powered by the <strong>Agent eXchange Layer (AXL)</strong> to fact-check, refine, and polish your ideas into highly authoritative content.</p>
        </section>

        <section class="input-section card">
            <div class="input-wrapper">
                <input type="text" id="topic-input" placeholder="What should we write about today?" autocomplete="off" />
                <button id="generate-btn" class="primary-btn">Generate</button>
            </div>
            <div id="status-indicator" class="status-indicator hidden">
                <div class="status-dot"></div>
                <span id="status-text">Writer is drafting...</span>
            </div>
        </section>

        <section id="result-section" class="result-section hidden card">
            <div id="result-content" class="result-content"></div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
